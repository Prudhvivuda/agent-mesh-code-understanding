{{- if .Values.otel.createBucket }}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-tempo-bucket
  namespace: {{ .Values.otel.namespace }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              mc alias set minio {{ .Values.minio.endpoint }} "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" && \
              mc mb --ignore-existing minio/{{ .Values.otel.tempo.bucket }}
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.minio.rootUser | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.minio.rootPassword | quote }}
{{- end }}
